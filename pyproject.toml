[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turn-mapper"
version = "0.1.0"
description = "TURN module: floor plan -> navigation graph (.turnmap)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "shapely>=2.0",
  "networkx>=3.2",
  "pymupdf>=1.24",
  "pytesseract>=0.3.10",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ml = ["torch>=2.2", "segmentation-models-pytorch>=0.3.3"]

[project.scripts]
turn-mapper = "turn_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turn_mapper = ["py.typed", "schema/*.json"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/turn_mapper/report.py" = ["E501"]  # inline HTML/CSS template
