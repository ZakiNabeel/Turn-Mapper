# FAST-NUCES Islamabad venue config. Only *where* the floors are in the PDF and venue facts live here;
# no drawing colours or thresholds (the pipeline estimates them per image).
venue:
  id: fast-isb
  name: FAST-NUCES Islamabad
source:
  file: samples/private/fast_blocks.pdf   # = Floor_Plans_2.pdf (gitignored until permission confirmed)
  sha256: 8316d9d778c7468d54d3de471216a95c5d340b5f9d95c1ddc2656a47070cd38d
  kind: pdf_embedded_images          # take embedded images at native resolution; don't re-render the page
label_patterns:
  A: '^A-?\d{2,3}[A-Z]?$'
  B: '^B-?\d{2,3}[A-Z]?$'
  C: '^C-?\d{3}$'
splits:                              # ADR-009 rev 2026-10-04: C is the main testing building -> dev/demo
  dev: [B, C]
  test: [A]
buildings:
  - { id: A, name: A Block }
  - { id: B, name: B Block }
  - { id: C, name: C Block }
floors:
  - { id: A-GF, building: A, level: 0,  page: 2, image_index: 0 }
  - { id: A-F1, building: A, level: 1,  page: 2, image_index: 1 }
  - { id: A-F2, building: A, level: 2,  page: 3, image_index: 0 }
  - { id: A-F3, building: A, level: 3,  page: 3, image_index: 1 }
  - { id: B-GF, building: B, level: 0,  page: 4, image_index: 0, notes: "cropped at bottom" }
  - { id: B-F1, building: B, level: 1,  page: 4, image_index: 1 }
  - { id: B-F2, building: B, level: 2,  page: 5, image_index: 0 }
  - { id: C-B1, building: C, level: -1, page: 6, image_index: 0 }
  - { id: C-GF, building: C, level: 0,  page: 6, image_index: 1 }
  - { id: C-F1, building: C, level: 1,  page: 7, image_index: 0 }
  - { id: C-F2, building: C, level: 2,  page: 7, image_index: 1, scale_like: C-F3 }  # re-exported image
  - { id: C-F3, building: C, level: 3,  page: 7, image_index: 2 }
  - { id: C-F4, building: C, level: 4,  page: 8, image_index: 0 }
  - { id: C-F5, building: C, level: 5,  page: 8, image_index: 1, scale_like: C-F3 }  # re-exported JPEG
# Site measurements (team, 2026-10-23/24, tape, feet; inside dimensions). Keys are floor ids or building ids
# (building entries apply to every floor of that building). Notes from the measurement sheet:
#   typical room: A 30 x 20 ft, B 30 x 24 ft, C 30 x 25 ft (D 30 x 25-26 ft: no D block in this PDF)
#   B227-A: 19.7 + 16.08 ft by 19.7 + 5.41 ft = 35.78 x 25.11 ft (sheet note: "almost 34 by 24")
#   A block 2nd-floor corridor: 90 x 12 ft
# A is the held-out test building (ADR-009): its measurements are site input, not tuning; nothing is
# adjusted by looking at A results.
scale_evidence:
  A:
    - {method: typical_room, size_ft: [30, 20]}
  B:
    - {method: typical_room, size_ft: [30, 24]}
    - {method: room_size, label: B-227A, size_ft: [35.78, 25.11], check_only: true}
  C:
    - {method: typical_room, size_ft: [30, 25]}
  A-F2:
    - {method: corridor_width, width_ft: 12, length_ft: 90, check_only: true}
